name: RoomSplat
options:
  bundleIdPrefix: com.roomsplat
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  RoomSplat:
    type: application
    platform: iOS
    sources:
      - RoomSplat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roomsplat.RoomSplat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "RoomSplat uses the camera and LiDAR to capture the room."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "RoomSplat streams captured frames to your local ingest server."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
