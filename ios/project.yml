name: RoomSplat
options:
  bundleIdPrefix: com.roomsplat
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  RoomSplat:
    type: application
    platform: iOS
    sources:
      - RoomSplat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roomsplat.RoomSplat
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: RoomSplat/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "RoomSplat uses the camera and LiDAR to capture the room."
        NSLocalNetworkUsageDescription: "RoomSplat streams captured frames to your local ingest server."
        # mDNS / Bonjour discovery of RoomSplat ingest servers on the local subnet.
        NSBonjourServices:
          - _roomsplat._tcp
          - _http._tcp
        # Expose recorded .roomsplat debug packages via Files / iTunes file sharing.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Development: allow ws:// and self-signed wss:// to a LAN/self-hosted ingest
        # server. A production build talking only to a valid TLS origin can drop this.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
