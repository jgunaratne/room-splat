[project]
name = "roomsplat-server"
version = "0.1.0"
description = "RoomSplat desktop server: live ingest, progressive training, viewer host"
requires-python = ">=3.11"

# The GPU-free pipeline (data contract, ingest, chunking, manifest, replay, viewer
# host) needs only these. Training on the 5090 additionally requires torch + gsplat,
# pinned below and recorded in README.md (SPEC.md §7): those extras are intentionally
# NOT default-installed so tests and CI run without CUDA.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "websockets>=12",
]

[project.optional-dependencies]
# Validated working combination on this RTX 5090 (Blackwell sm_120), SPEC.md §7.
# gsplat JIT-compiles CUDA kernels on first use; do not widen without re-running the
# M2 GPU gate (tests/test_gsplat_gpu.py). See README.md for the version table.
train = [
    "torch==2.11.0",   # +cu130
    "gsplat==1.5.3",
    "pillow>=10",
    "ninja",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["app", "ingest", "train", "simplify", "roomsplat"]
