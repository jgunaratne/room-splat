# CI: replay fixtures + run server tests on every push (SPEC.md §8).
#
# The replay job generates 3 synthetic .roomsplat fixtures and replays each
# through the full server pipeline (synthetic backend, no GPU needed). The
# test job runs the existing pytest suite. Both are GPU-free.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Run pytest
        run: python -m pytest -v --tb=short

  replay-fixtures:
    name: Replay fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Install server (GPU-free)
        run: pip install -e server/

      - name: Generate synthetic fixtures
        run: python fixtures/generate_synthetic.py --out fixtures/

      - name: Replay all fixtures
        run: python fixtures/replay_all.py --fixtures fixtures/ --out /tmp/roomsplat-ci
        env:
          ROOMSPLAT_BACKEND: synthetic

  web-build:
    name: Web viewer build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx vite build
