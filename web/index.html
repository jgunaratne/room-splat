<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RoomSplat</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b0d; overflow: hidden; }
      #hud {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        font: 12px/1.5 ui-monospace, monospace; color: #cfd2d6;
        background: rgba(20,22,26,.72); padding: 10px 12px; border-radius: 8px;
      }
      #hud b { color: #fff; }
      #hud button { font: inherit; margin-top: 6px; cursor: pointer; }
      #hud .hint { color: #7f8792; margin-top: 6px; }
      #projectRow { margin-top: 6px; display: flex; gap: 4px; align-items: center; }
      #projectRow select { font: inherit; max-width: 190px; }
      .warn { color: #ffb454; }
      #pip {
        position: fixed; top: 12px; right: 12px; z-index: 10;
        width: 240px; background: rgba(20,22,26,.72); padding: 6px;
        border-radius: 8px; display: none;
      }
      #pip img {
        display: block; margin: 0 auto; max-width: 100%; max-height: 340px;
        border-radius: 4px; background: #000;
      }
      #pip .cap {
        font: 11px/1.4 ui-monospace, monospace; color: #cfd2d6;
        padding: 4px 2px 2px; display: flex; justify-content: space-between;
      }
      #pip .live { color: #ff3b30; }
      #console {
        position: fixed; bottom: 12px; right: 12px; z-index: 10;
        width: 340px; height: 170px; background: rgba(12,13,16,.82);
        border-radius: 8px; padding: 8px 10px; overflow-y: auto;
        font: 11px/1.45 ui-monospace, monospace; color: #b9c0c8;
      }
      #console .hdr { color: #7f8792; margin-bottom: 4px; }
      #console .line { white-space: pre-wrap; word-break: break-word; }
      #console .t { color: #5c636d; }
      #console .info { color: #b9c0c8; }
      #console .ok { color: #7ddc8f; }
      #console .warn { color: #ffb454; }
      #console .dim { color: #6b7280; }
      #tabs {
        position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 20;
        display: flex; gap: 2px; background: rgba(20,22,26,.72); padding: 3px;
        border-radius: 10px;
      }
      #tabs button {
        font: 12px/1 ui-monospace, monospace; color: #cfd2d6; background: transparent;
        border: 0; padding: 8px 16px; border-radius: 8px; cursor: pointer;
      }
      #tabs button.active { background: #2b6cf0; color: #fff; }
    </style>
  </head>
  <body>
    <div id="tabs">
      <button id="tabSplat" class="active">Gaussian Splat</button>
      <button id="tabLidar">LiDAR</button>
    </div>
    <div id="hud">
      <div><b>RoomSplat</b> viewer</div>
      <div id="status">connecting…</div>
      <div id="counts"></div>
      <button id="mode">camera: follow</button>
      <button id="coverage">coverage: on</button>
      <button id="reset">reset scene</button>
      <div id="projectRow">
        <button id="save">save project</button>
        <select id="projects"><option value="">— saved projects —</option></select>
        <button id="load">load</button>
      </div>
      <div class="hint">click to look · WASD move · Space/Ctrl up·down · Shift boost · wheel zoom · Esc release</div>
    </div>
    <div id="pip">
      <img id="pipImg" alt="live capture" />
      <div class="cap"><span class="live">● LIVE</span><span id="pipFrame"></span></div>
    </div>
    <div id="console"><div class="hdr">system console</div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
